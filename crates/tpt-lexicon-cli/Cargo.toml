[package]
name = "tpt-lexicon-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "CLI for the TPT Lexicon pipeline: ingest, compress, verify, and translate."
readme = "README.md"
keywords = ["tokenizer", "cli", "nlp", "compression", "llm"]

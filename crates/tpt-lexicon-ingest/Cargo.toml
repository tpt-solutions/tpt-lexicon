[package]
name = "tpt-lexicon-ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Streaming, syntax-aware parser yielding semantic chunks without full-string allocation."
readme = "README.md"
keywords = ["parser", "streaming", "tree-sitter", "no-std", "ast"]
categories = ["parsing", "no-std", "text-processing"]

[dependencies]
tpt-lexicon-core = { workspace = true }
tree-sitter = { version = "0.24", optional = true }
tree-sitter-rust = { version = "0.21", optional = true }
tree-sitter-typescript = { version = "0.21", optional = true }

[features]
std = []
tree-sitter = ["std", "dep:tree-sitter"]
tree-sitter-rust = ["tree-sitter", "dep:tree-sitter-rust"]
tree-sitter-typescript = ["tree-sitter", "dep:tree-sitter-typescript"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tree-sitter = { version = "0.24" }
tree-sitter-rust = { version = "0.21" }

[workspace]
resolver = "2"
members = [
    "crates/tpt-lexicon-core",
    "crates/tpt-lexicon-ingest",
    "crates/tpt-lexicon-ir",
    "crates/tpt-lexicon-verify",
    "crates/tpt-lexicon-translate",
    "crates/tpt-lexicon-gpu",
    "examples",
    "crates/tpt-lexicon-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-lexicon"
authors = ["TPT Solutions"]

[workspace.dependencies]
tpt-lexicon-core = { path = "crates/tpt-lexicon-core", version = "0.1.0" }
tpt-lexicon-ingest = { path = "crates/tpt-lexicon-ingest", version = "0.1.0" }
tpt-lexicon-ir = { path = "crates/tpt-lexicon-ir", version = "0.1.0" }
tpt-lexicon-verify = { path = "crates/tpt-lexicon-verify", version = "0.1.0" }
tpt-lexicon-translate = { path = "crates/tpt-lexicon-translate", version = "0.1.0" }
tpt-lexicon-gpu = { path = "crates/tpt-lexicon-gpu", version = "0.1.0" }

[profile.release]
lto = true
codegen-units = 1
